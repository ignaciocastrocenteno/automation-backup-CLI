[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-backup-cli"
version = "0.1.0"
description = "A CLI tool to organize and backup files with dry-run, exclusion patterns, and optional compression."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ignacio", email = "you@example.com" }]
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0"
]

[project.scripts]
automation-backup = "automation_backup_cli.cli:app"

[tool.pytest.ini_options]
addopts = "-q --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "black>=25.9.0",
    "freezegun>=1.5.5",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]
